{% extends "base.html" %}
{% from "_ui.html" import icon with context %}
{% block title %}Новий пароль{% endblock %}
{% block guest %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand" style="padding:0 0 6px"><span class="logo">{{ icon('shield') }}</span>Новий пароль</div>
    <p class="muted" style="margin:0 0 20px">{{ me.full_name }}, зараз у вас тимчасовий або стандартний пароль. Придумайте свій, щоб продовжити.</p>
    <form method="post" class="stack">
      <div><label>Новий пароль, від 6 символів</label><input name="password" type="password" minlength="6" autocomplete="new-password" autofocus required></div>
      <div><label>Повторіть пароль</label><input name="password2" type="password" minlength="6" autocomplete="new-password" required></div>
      <button class="primary xl">Зберегти і продовжити</button>
    </form>
    <form method="post" action="{{ url_for('logout') }}" class="center" style="margin:16px 0 0"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="ghost">Вийти</button></form>
  </div>
</div>
{% endblock %}
