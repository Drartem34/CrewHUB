{% extends "base.html" %}
{% from "_ui.html" import icon with context %}
{% block title %}Вихід{% endblock %}
{% block guest %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand" style="padding:0 0 6px"><span class="logo">{{ icon('logout') }}</span>Вийти з акаунта?</div>
    <p class="muted" style="margin:0 0 20px">{{ me.full_name }}, на цьому пристрої знадобиться знову ввести номер і пароль.</p>
    <form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="primary xl">Вийти</button></form>
    <p class="center" style="margin:16px 0 0"><a href="{{ url_for('index') }}">Залишитись</a></p>
  </div>
</div>
{% endblock %}
