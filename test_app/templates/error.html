<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помилка · CrewHub</title>
<style>
  :root { --bg: #f4f6fb; --card: #fff; --text: #101828; --muted: #667085; --brand: #e8173d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0f17; --card: #131a26; --text: #e9edf5; --muted: #98a2b3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border-radius: 18px; padding: 28px; max-width: 380px; text-align: center; }
  p { color: var(--muted); } a { display: inline-block; margin-top: 8px; background: var(--brand); color: #fff;
    padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; }
</style></head>
<body><div class="card"><h2>Щось пішло не так</h2><p>Сервер працює, але цей запит не вдався. Оновіть сторінку за кілька секунд.</p>
<a href="/">Оновити</a></div></body></html>
